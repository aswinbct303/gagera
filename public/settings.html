<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gagera — Settings</title><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/settings.css"></head>
<body><header class="topbar shell"><a class="brand" href="/"><span class="brand-mark">G</span><span>Gagera</span></a><nav class="nav"><a href="/">Pairing</a><a class="active" href="/settings">Settings</a></nav></header>
<main class="shell settings-page"><section class="settings-intro"><p class="eyebrow">Workspace controls</p><h1>Settings that stay out of your way.</h1><p class="lede">Sign in with the web password sent after pairing, then tune the bot for your workflow.</p></section><section id="login" class="panel"><p class="eyebrow">Secure access</p><h2>Open your settings</h2><form id="login-form"><label for="number">WhatsApp number</label><input id="number" required inputmode="numeric" placeholder="919876543210"><label for="password">Web password</label><input id="password" required type="password" placeholder="Enter your password"><button class="button primary" type="submit">Continue <span>→</span></button><div id="login-error" class="result error" hidden></div></form></section><section id="dashboard" class="panel" hidden><div class="panel-head"><div><p class="eyebrow">Configuration</p><h2>Bot preferences</h2></div><button class="button primary compact" id="logout" type="button">Log out</button></div><form id="settings-form"><div id="settings-grid" class="settings-grid"></div><button class="button primary" type="submit">Save changes <span>→</span></button><div id="save-result" class="result" hidden></div></form></section></main><script src="/assets/settings.js" defer></script></body></html>
